<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Museum Wrapped — Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --fg:oklch(0.96 0.02 85);
    --muted:oklch(0.75 0.04 75);
    --gold:oklch(0.82 0.15 82);
    --line:oklch(0.35 0.05 65 / 40%);
    --display:"Cormorant Garamond",Georgia,serif;
    --body:"Inter",system-ui,sans-serif;
    --night:radial-gradient(ellipse at top,oklch(0.28 0.08 55) 0%,oklch(0.14 0.03 55) 55%,oklch(0.10 0.02 55) 100%);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:oklch(0.08 0.015 55);color:var(--fg);font-family:var(--body);min-height:100vh;padding:28px 20px 60px}

  /* ---------- Werkbank ---------- */
  .lab{max-width:1420px;margin:0 auto}
  .labtop{display:flex;align-items:flex-start;gap:20px;flex-wrap:wrap}
  .lab h1{font-family:var(--display);font-weight:300;font-size:30px;letter-spacing:-0.01em}
  .lab p{color:var(--muted);font-size:13px;margin-top:6px;max-width:72ch;line-height:1.6}
  .langsw{margin-left:auto;display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;flex:0 0 auto}
  .langsw button{font:600 10.5px/1 var(--body);letter-spacing:.16em;color:var(--muted);background:transparent;
    border:none;padding:11px 17px;cursor:pointer;transition:.18s}
  .langsw button:hover{color:var(--fg)}
  .langsw button[aria-pressed="true"]{background:var(--gold);color:oklch(0.16 0.03 55)}
  .tabs{display:flex;gap:8px;margin:22px 0 26px;flex-wrap:wrap}
  .tabs button{font:500 11px/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);
    background:transparent;border:1px solid var(--line);border-radius:999px;padding:9px 16px;cursor:pointer;transition:.18s}
  .tabs button:hover{color:var(--fg);border-color:oklch(0.82 0.15 82 / 45%)}
  .tabs button[aria-pressed="true"]{color:oklch(0.16 0.03 55);background:var(--gold);border-color:var(--gold)}
  .rack{display:flex;gap:34px;align-items:flex-start;flex-wrap:wrap}
  .slot{width:392px}
  .slot.hidden{display:none}
  .slot > figcaption{margin-bottom:12px}
  .slot .name{font-family:var(--display);font-size:22px;font-weight:400}
  .slot .why{color:var(--muted);font-size:12px;line-height:1.55;margin-top:3px;min-height:52px}

  /* ---------- Gerät ---------- */
  .device{position:relative;width:392px;height:846px;border-radius:38px;padding:9px;
    background:linear-gradient(160deg,oklch(0.30 0.02 60),oklch(0.14 0.01 60));
    box-shadow:0 40px 90px -30px oklch(0 0 0/.85), 0 0 0 1px oklch(0.45 0.04 65/.5) inset}
  .screen{position:relative;width:100%;height:100%;border-radius:30px;overflow:hidden;background:var(--night);
    display:flex;flex-direction:column;isolation:isolate}
  .screen::after{content:"";position:absolute;inset:0;pointer-events:none;border-radius:30px;
    box-shadow:0 0 0 1px oklch(0.82 0.15 82/.10) inset}

  /* ---------- gemeinsam ---------- */
  .topbar{display:flex;align-items:center;justify-content:space-between;padding:16px 20px 12px;flex:0 0 auto}
  .brand{display:flex;align-items:center;gap:7px;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
  .brand i{color:var(--gold);font-style:normal}
  .count{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
  .count b{color:var(--gold);font-weight:500}
  .hair{height:1px;background:linear-gradient(90deg,transparent,var(--line),transparent);flex:0 0 auto}
  .eyebrow{font-size:9.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
  .frage{font-family:var(--display);font-weight:300;line-height:1.2;letter-spacing:-0.005em}

  .mic{position:relative;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;cursor:pointer;
    background:oklch(0.82 0.15 82/.07);border:1px solid oklch(0.82 0.15 82/.45);color:var(--gold);transition:.2s}
  .mic:hover{background:oklch(0.82 0.15 82/.14)}
  .mic.rec{background:oklch(0.62 0.21 35/.16);border-color:oklch(0.62 0.21 35/.7);color:oklch(0.80 0.16 40)}
  .mic.rec::before,.mic.rec::after{content:"";position:absolute;inset:-2px;border-radius:50%;
    border:1px solid oklch(0.62 0.21 35/.55);animation:ring 2.1s ease-out infinite}
  .mic.rec::after{animation-delay:1.05s}
  @keyframes ring{0%{transform:scale(1);opacity:.85}100%{transform:scale(1.55);opacity:0}}
  .mic.done{background:oklch(0.82 0.15 82/.16);border-color:var(--gold)}
  .hint{font-size:11px;color:var(--muted);text-align:center;min-height:15px}
  .live{font-family:var(--display);font-style:italic;font-size:15px;line-height:1.35;color:oklch(0.88 0.06 60);
    text-align:center;min-height:20px}
  .typed{width:100%;background:oklch(0.22 0.04 55/.6);border:1px solid var(--line);border-radius:14px;color:var(--fg);
    font:400 13px/1.5 var(--body);padding:11px 13px;resize:none;outline:none}
  .typed:focus{border-color:oklch(0.82 0.15 82/.5)}
  .linkish{background:none;border:none;color:var(--muted);font:500 10.5px/1 var(--body);letter-spacing:.14em;
    text-transform:uppercase;cursor:pointer;padding:6px;text-decoration:underline;text-underline-offset:4px}
  .linkish:hover{color:var(--gold)}
  .finish{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;cursor:pointer;
    font:500 11px/1 var(--body);letter-spacing:.2em;text-transform:uppercase;padding:14px;
    background:var(--gold);color:oklch(0.16 0.03 55);border:none;transition:.2s}
  .finish:disabled{background:transparent;color:oklch(0.55 0.03 65);border:1px solid var(--line);cursor:not-allowed}
  .saved{display:flex;gap:9px;align-items:flex-start;border-left:2px solid var(--gold);padding-left:11px;text-align:left}
  .saved p{font-family:var(--display);font-style:italic;font-size:15px;line-height:1.4;color:oklch(0.92 0.04 70)}
  .kthumb{width:78px;height:78px;border-radius:11px;flex:0 0 auto;overflow:hidden;background:oklch(0.14 0.02 55);
    display:grid;place-items:center;border:1px solid oklch(0.82 0.15 82/.12)}
  .kthumb img{width:100%;height:100%;object-fit:cover}
  .vtitle{font-family:var(--display);font-size:20px;font-weight:400;line-height:1.22;margin:2px 0 12px}

  .sheet{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;justify-content:flex-end;
    background:oklch(0.06 0.01 55/.62);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.24s}
  .sheet.open{opacity:1;pointer-events:auto}
  .sheetbody{background:linear-gradient(180deg,oklch(0.20 0.038 57),oklch(0.12 0.02 55));border-top:1px solid oklch(0.82 0.15 82/.28);
    border-radius:26px 26px 30px 30px;padding:12px 22px 24px;display:flex;flex-direction:column;gap:12px;
    transform:translateY(14px);transition:.24s}
  .sheet.open .sheetbody{transform:none}
  .grab{width:38px;height:3px;border-radius:2px;background:oklch(0.70 0.04 70/.35);margin:0 auto 4px}
  .sheethero{display:flex;gap:13px;align-items:center}
  .sheethero .kthumb{width:64px;height:64px}
  .sfrage{font-size:23px}

  /* ---------- A. Vitrine ---------- */
  .vitrine{flex:1;display:flex;flex-direction:column;padding:0 22px 18px;min-height:0}
  .case{position:relative;flex:1 1 auto;min-height:0;border-radius:16px;margin-bottom:16px;overflow:hidden;
    background:linear-gradient(180deg,oklch(0.19 0.035 58),oklch(0.12 0.02 55));
    border:1px solid oklch(0.82 0.15 82/.14);display:grid;place-items:center}
  .case::before{content:"";position:absolute;left:50%;top:-32%;width:150%;height:80%;transform:translateX(-50%);
    background:radial-gradient(ellipse at center,oklch(0.85 0.08 75/.16),transparent 62%);pointer-events:none}
  .case img{max-width:88%;max-height:88%;object-fit:contain;filter:drop-shadow(0 22px 34px oklch(0 0 0/.75))}
  .case .plaque{position:absolute;left:14px;bottom:12px;right:14px;display:flex;justify-content:space-between;gap:10px}
  .case .plaque span{font-size:9px;letter-spacing:.22em;text-transform:uppercase;color:oklch(0.78 0.05 70/.75)}
  .vfrage{font-size:26px;margin-bottom:auto}
  .vfoot{display:flex;flex-direction:column;align-items:center;gap:9px;padding-top:14px}
  .dots{display:flex;gap:7px;justify-content:center;padding:12px 0 2px}
  .dots button{width:7px;height:7px;border-radius:50%;border:1px solid oklch(0.70 0.04 70/.5);background:transparent;
    cursor:pointer;padding:0;transition:.2s}
  .dots button.on{background:var(--gold);border-color:var(--gold);transform:scale(1.35)}
  .dots button.has{background:oklch(0.82 0.15 82/.45);border-color:oklch(0.82 0.15 82/.6)}
  .nav{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;display:grid;
    place-items:center;background:oklch(0.10 0.02 55/.55);border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .nav:hover{color:var(--gold);border-color:oklch(0.82 0.15 82/.5)}
  .nav.l{left:8px} .nav.r{right:8px}

  /* ---------- B. Kartei ---------- */
  .kartei{flex:1;overflow-y:auto;padding:6px 18px 96px;display:flex;flex-direction:column;gap:11px}
  .kartei::-webkit-scrollbar{width:0}
  .khead{font-family:var(--display);font-size:25px;font-weight:300;line-height:1.15;margin:8px 2px 4px}
  .ksub{color:var(--muted);font-size:11.5px;line-height:1.5;margin:0 2px 10px}
  .kcard{display:flex;gap:13px;align-items:stretch;text-align:left;cursor:pointer;padding:10px;border-radius:16px;
    background:oklch(0.22 0.04 55/.45);border:1px solid var(--line);transition:.18s;color:inherit;font:inherit}
  .kcard:hover{border-color:oklch(0.82 0.15 82/.4)}
  .kcard.has{border-color:oklch(0.82 0.15 82/.45);background:oklch(0.82 0.15 82/.06)}
  .kbody{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:5px}
  .kbody h3{font-family:var(--display);font-size:16.5px;font-weight:400;line-height:1.22}
  .kstate{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .kcard.has .kstate{color:var(--gold)}
  .kbar{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 18px;display:flex;flex-direction:column;gap:10px;
    background:linear-gradient(180deg,transparent,oklch(0.10 0.02 55) 34%)}

  /* ---------- C. Saal ---------- */
  .saal{flex:1;display:flex;flex-direction:column;padding:4px 18px 18px;min-height:0}
  .plan{position:relative;flex:1 1 auto;min-height:0;border-radius:18px;border:1px solid var(--line);overflow:hidden;
    background:
      repeating-linear-gradient(0deg,oklch(0.82 0.15 82/.045) 0 1px,transparent 1px 34px),
      repeating-linear-gradient(90deg,oklch(0.82 0.15 82/.045) 0 1px,transparent 1px 34px),
      linear-gradient(165deg,oklch(0.17 0.03 58),oklch(0.11 0.018 55))}
  .room{position:absolute;border:1px solid oklch(0.82 0.15 82/.22);border-radius:10px;background:oklch(0.82 0.15 82/.035)}
  .room span{position:absolute;left:9px;top:7px;font-size:8.5px;letter-spacing:.2em;text-transform:uppercase;
    color:oklch(0.78 0.05 70/.6);white-space:nowrap}
  .pin{position:absolute;width:34px;height:34px;transform:translate(-50%,-50%);border-radius:50%;cursor:pointer;
    display:grid;place-items:center;background:oklch(0.10 0.02 55/.85);border:1.5px solid oklch(0.70 0.10 75/.55);
    color:oklch(0.80 0.06 70);transition:.18s;padding:0;font:600 10px/1 var(--body)}
  .pin.on{border-color:var(--gold);color:var(--gold);box-shadow:0 0 0 5px oklch(0.82 0.15 82/.10)}
  .pin.has{background:var(--gold);border-color:var(--gold);color:oklch(0.16 0.03 55)}
  .planfoot{display:flex;justify-content:space-between;align-items:center;padding:10px 2px 12px}
  .legend{display:flex;gap:12px;font-size:9px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .detail{border-radius:18px;border:1px solid oklch(0.82 0.15 82/.22);background:oklch(0.20 0.038 57/.85);
    padding:15px 16px 17px;display:flex;flex-direction:column;gap:11px}
  .detail .row{display:flex;gap:12px;align-items:center}
  .detail .kthumb{width:58px;height:58px}
  .dfrage{font-size:19px}

  /* ---------- D. Führung ---------- */
  .fuehrung{flex:1;display:flex;flex-direction:column;padding:2px 16px 14px;min-height:0}
  .roomhead{display:flex;align-items:center;gap:10px;padding:4px 2px 10px}
  .roomhead .rn{font-family:var(--display);font-size:23px;font-weight:400;line-height:1;flex:1}
  .roomhead .rc{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .rnav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;
    background:transparent;border:1px solid var(--line);color:var(--muted);cursor:pointer}
  .rnav:hover{color:var(--gold);border-color:oklch(0.82 0.15 82/.5)}
  .rstage{position:relative;flex:1 1 auto;min-height:0;border-radius:18px;overflow:hidden;
    border:1px solid oklch(0.82 0.15 82/.20);
    background:
      repeating-linear-gradient(0deg,oklch(0.82 0.15 82/.04) 0 1px,transparent 1px 38px),
      repeating-linear-gradient(90deg,oklch(0.82 0.15 82/.04) 0 1px,transparent 1px 38px),
      linear-gradient(165deg,oklch(0.18 0.032 58),oklch(0.11 0.018 55));
    animation:roomin .42s ease}
  @keyframes roomin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
  .door{position:absolute;left:50%;transform:translateX(-50%);width:66px;height:3px;border-radius:2px;
    background:oklch(0.82 0.15 82/.30)}
  .door.top{top:0} .door.bot{bottom:0}
  .door span{position:absolute;left:50%;transform:translateX(-50%);top:8px;font-size:8px;letter-spacing:.2em;
    text-transform:uppercase;color:oklch(0.78 0.05 70/.5);white-space:nowrap}
  .door.bot span{top:auto;bottom:8px}
  .rpin{position:absolute;transform:translate(-50%,-50%);width:66px;height:66px;border-radius:50%;padding:0;
    overflow:hidden;cursor:pointer;background:oklch(0.14 0.02 55);border:2px solid oklch(0.70 0.08 75/.45);
    transition:.2s;z-index:2}
  .rpin img{width:100%;height:100%;object-fit:cover;opacity:.82;transition:.2s}
  .rpin:hover img{opacity:1}
  .rpin.near{width:82px;height:82px;border-color:var(--gold);box-shadow:0 0 0 7px oklch(0.82 0.15 82/.13),0 10px 26px oklch(0 0 0/.6)}
  .rpin.near img{opacity:1}
  .rpin.has{border-color:var(--gold)}
  .rpin.has::after{content:"";position:absolute;inset:0;background:oklch(0.82 0.15 82/.18)}
  .rtick{position:absolute;transform:translate(-50%,0);z-index:3;display:grid;place-items:center;
    width:20px;height:20px;border-radius:50%;background:var(--gold);color:oklch(0.16 0.03 55);pointer-events:none}
  .rlabel{position:absolute;transform:translate(-50%,0);z-index:2;font-size:8.5px;letter-spacing:.16em;
    text-transform:uppercase;color:oklch(0.80 0.05 70/.75);white-space:nowrap;pointer-events:none;
    background:oklch(0.10 0.02 55/.7);padding:3px 7px;border-radius:999px}
  .me{position:absolute;width:15px;height:15px;border-radius:50%;transform:translate(-50%,-50%);z-index:4;
    background:oklch(0.82 0.11 235);border:2px solid oklch(0.97 0.02 235);
    box-shadow:0 0 0 1px oklch(0.45 0.10 235/.6), 0 2px 8px oklch(0 0 0/.7);pointer-events:none;transition:left .14s linear,top .14s linear}
  .me::after{content:"";position:absolute;inset:-9px;border-radius:50%;background:oklch(0.82 0.11 235/.18);
    animation:pulse 2.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.1);opacity:0}}
  .cone{position:absolute;width:70px;height:70px;transform-origin:50% 50%;z-index:3;pointer-events:none;
    background:conic-gradient(from -22deg,oklch(0.82 0.11 235/.28) 0deg,oklch(0.82 0.11 235/.03) 44deg,transparent 45deg);
    border-radius:50%;transition:left .14s linear,top .14s linear}
  .fbar{display:flex;align-items:center;gap:8px;padding:9px 2px}
  .chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;border:1px solid var(--line);
    background:oklch(0.22 0.04 55/.5);color:var(--muted);cursor:pointer;padding:8px 13px;
    font:500 9.5px/1 var(--body);letter-spacing:.15em;text-transform:uppercase;transition:.18s}
  .chip:hover{color:var(--fg);border-color:oklch(0.82 0.15 82/.45)}
  .chip.on{color:oklch(0.16 0.03 55);background:oklch(0.82 0.11 235);border-color:oklch(0.82 0.11 235)}
  .dist{margin-left:auto;font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .dist b{color:var(--gold);font-weight:500}
  .arrived{display:inline-flex;align-items:center;gap:6px;font-size:9.5px;letter-spacing:.18em;
    text-transform:uppercase;color:oklch(0.82 0.11 235)}
  .tapphoto{position:relative;flex:0 0 auto;padding:0;border:none;background:none;cursor:pointer;border-radius:11px}
  .tapphoto .kthumb{width:58px;height:58px}
  .tapphoto .more{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;
    display:grid;place-items:center;background:var(--gold);color:oklch(0.16 0.03 55);font:600 11px/1 var(--body)}
  .strip{display:flex;gap:8px;overflow-x:auto}
  .strip::-webkit-scrollbar{height:0}
  .strip button{flex:0 0 auto;width:56px;height:56px;border-radius:10px;overflow:hidden;padding:0;cursor:pointer;
    border:1px solid var(--line);background:oklch(0.14 0.02 55)}
  .strip button.on{border-color:var(--gold)}
  .strip img{width:100%;height:100%;object-fit:cover}
  .bigshot{width:100%;height:190px;border-radius:14px;overflow:hidden;background:oklch(0.13 0.02 55);
    display:grid;place-items:center;border:1px solid oklch(0.82 0.15 82/.14)}
  .bigshot img{max-width:100%;max-height:100%;object-fit:contain}
  .beschreibung{font-size:12.5px;line-height:1.62;color:oklch(0.86 0.03 70);max-height:132px;overflow-y:auto}
  .beschreibung::-webkit-scrollbar{width:0}
  .audio{display:flex;align-items:center;gap:11px;border-radius:14px;padding:10px 13px;
    border:1px solid var(--line);background:oklch(0.22 0.04 55/.45)}
  .audio .play{width:34px;height:34px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
    border:1px solid oklch(0.82 0.15 82/.45);background:oklch(0.82 0.15 82/.08);color:var(--gold)}
  .wave{flex:1;display:flex;align-items:center;gap:2px;height:22px}
  .wave i{flex:1;background:oklch(0.78 0.06 70/.35);border-radius:1px}
  .audio .len{font-size:10px;letter-spacing:.12em;color:var(--muted)}
  .stub{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:oklch(0.70 0.04 70/.6)}

  /* ---------- Wrapped (Stories) ---------- */
  .wrap{position:absolute;inset:0;z-index:9;display:flex;flex-direction:column;background:var(--night)}
  .wbars{display:flex;gap:4px;padding:14px 16px 8px;flex:0 0 auto}
  .wbars i{flex:1;height:2px;border-radius:1px;background:oklch(0.70 0.04 70/.25)}
  .wbars i.on{background:var(--gold)}
  .wframe{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;gap:16px;
    padding:8px 26px 20px;text-align:left;animation:fadein .38s ease}
  @keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .wbig{font-family:var(--display);font-weight:300;font-size:34px;line-height:1.12;letter-spacing:-0.01em}
  .wmid{font-family:var(--display);font-weight:300;font-size:26px;line-height:1.2}
  .wsub{color:var(--muted);font-size:13.5px;line-height:1.6}
  .wgold{color:var(--gold)}
  .wquote{font-family:var(--display);font-style:italic;font-size:25px;line-height:1.3;color:oklch(0.94 0.03 75)}
  .wecho{font-size:13px;line-height:1.6;color:var(--muted);border-left:2px solid oklch(0.82 0.15 82/.5);padding-left:13px}
  .wstats{display:flex;flex-direction:column;gap:2px}
  .wstat{display:flex;align-items:baseline;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let activeRec = null;

function makeRecorder({ onInterim, onFinal, onState }) {
  return {
    toggle(objId) {
      if (activeRec) { try { activeRec.stop(); } catch (e) {} activeRec = null; onState("idle"); return; }
      if (!SR) { onState("nospeech"); return; }
      const rec = new SR();
      rec.lang = t().speech; rec.interimResults = true; rec.continuous = false;
      let finalText = "";
      rec.onresult = (e) => {
        let interim = "";
        for (let i = e.resultIndex; i < e.results.length; i++) {
          const s = e.results[i][0].transcript;
          if (e.results[i].isFinal) finalText += s; else interim += s;
        }
        onInterim((finalText + " " + interim).trim());
      };
      rec.onerror = () => { activeRec = null; onState("idle"); };
      rec.onend = () => {
        activeRec = null; onState("idle");
        if (finalText.trim()) onFinal(objId, finalText.trim());
      };
      activeRec = rec; onState("rec"); onInterim("");
      try { rec.start(); } catch (e) { activeRec = null; onState("idle"); }
    }
  };
}

const el = (html) => { const tpl = document.createElement("template"); tpl.innerHTML = html.trim(); return tpl.content.firstElementChild; };
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const FALLBACK = () => ({

  archetype: LANG === "de"

  go_deeper: null,
  closing: LANG === "de"
    ? "Das war dein Besuch, in deinen Worten. Deine Sprachaufnahme wurde in Text umgewandelt und danach gelöscht."
    : "That was your visit, in your own words. Your voice recording was turned into text and then deleted.",
});

function startWrapped(host, answers, startedAt, onRestart) {
  const T0 = t();
  const reactions = Object.keys(answers).map(id => ({
    object_id: id, input_type: "text", transcript_text: answers[id],
    reaction_emoji: null, timestamp: new Date().toISOString(),
  }));
  const payload = {
    session: "S-" + Date.now(),
    duration_min: Math.max(1, Math.round((Date.now() - startedAt) / 60000)),
    mode: "solo",
    reactions,
  };

  const layer = el(`<div class="wrap"></div>`);
  host.append(layer);

  /* Ladezustand: der Aufruf dauert um die 15 Sekunden, das muss die Skizze tragen */
  let li = 0;
  layer.innerHTML = "";
  const load = el(`<div class="wload">
      <div class="wloadring"></div>
      <div class="wloadtext">${esc(T0.loading[0])}</div>
      <div class="wnote">${esc(T0.loadNote)}</div>
    </div>`);
  layer.append(load);
  const cycle = setInterval(() => {
    li = (li + 1) % T0.loading.length;
    const n = load.querySelector(".wloadtext");
    if (n) { n.style.animation = "none"; n.textContent = T0.loading[li]; n.offsetHeight; n.style.animation = "fadein .5s ease"; }
  }, 3600);

  fetch(WEBHOOK_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  })
    .then(r => r.json())
    .then(j => show(j && j.greeting ? j : FALLBACK()))
    .catch(() => show(FALLBACK()));

  function show(w) {
    clearInterval(cycle);
    const T = t();
    const words = (Array.isArray(w.your_words) ? w.your_words : []).slice(0, 3);
    const st = w.stats || {};
    const frames = [];

    frames.push(() => `<div class="eyebrow">${esc(T.wIntro)}</div>
      <div class="wbig">${esc(w.greeting)}</div>`);

    if (w.archetype && w.archetype.name) frames.push(() => `<div class="eyebrow">${esc(T.wIntro)}</div>
      <div class="wbig wgold">${esc(w.archetype.name)}</div>
      <div class="wsub">${esc(w.archetype.subtitle)}</div>`);

    frames.push(() => `<div class="eyebrow">${esc(T.wStatsHead)}</div>
      <div class="wstats">
        <div class="wstat"><b>${esc(st.reflections ?? Object.keys(answers).length)}</b><span class="wsub">${esc(T.statReflections)}</span></div>
        <div class="wstat"><b>${esc(st.objects_saved ?? Object.keys(answers).length)}</b><span class="wsub">${esc(T.statObjects)}</span></div>
        <div class="wstat"><b>${esc(st.duration_min ?? payload.duration_min)}</b><span class="wsub">${esc(T.statMinutes)}</span></div>
      </div>`);

    words.forEach(m => {
      const o = obj(m.object_id);
      frames.push(() => `
        ${o ? `<div class="wshot"><img src="${IMG}${o.img}" alt="" /></div>` : ""}
        <div class="eyebrow">${esc(T.wWordsHead)}</div>
        <div class="wquote">„${esc(m.quote)}“</div>
        ${m.echo ? `<div class="wecho">${esc(m.echo)}</div>` : ""}
        <div class="wsub" style="font-size:11.5px">${esc(o ? loc(o).title : m.object_title)}</div>`);
    });

    if (w.reflective_question) frames.push(() => `<div class="eyebrow">${esc(T.wQuestion)}</div>
      <div class="wmid"><span class="wgold">„</span>${esc(w.reflective_question)}<span class="wgold">“</span></div>`);

    if (w.go_deeper && w.go_deeper.title) frames.push(() => `<div class="eyebrow">${esc(T.wDeeper)}</div>
      <div class="wmid">${esc(w.go_deeper.title)}</div>
      <div class="wsub">${esc(w.go_deeper.reason)}</div>
      <div class="eyebrow" style="color:var(--muted)">${esc(String(w.go_deeper.room || "").replace(/^Raum\s*"|"$/g, ""))}</div>`);

    frames.push(() => `<div class="wmid">${esc(w.closing)}</div>
      <div class="wnote">SMÄK · Museum Wrapped</div>`);

    let i = 0;
    function paint() {
      layer.innerHTML = "";
      layer.append(el(`<div class="wbars">${frames.map((_, k) => `<i class="${k <= i ? "on" : ""}"></i>`).join("")}</div>`));
      layer.append(el(`<div class="wframe">${frames[i]()}</div>`));
      const foot = el(`<div class="wfoot"></div>`);
      if (i === frames.length - 1) {
        const again = el(`<button class="linkish">${SVG.redo} ${esc(T.restart)}</button>`);
        again.onclick = () => { layer.remove(); onRestart(); };
        foot.append(again);
      }
      layer.append(foot);
      const back = el(`<button class="wtap l" aria-label="back"></button>`);
      const fwd = el(`<button class="wtap r" aria-label="next"></button>`);
      back.onclick = () => { if (i > 0) { i--; paint(); } };
      fwd.onclick = () => { if (i < frames.length - 1) { i++; paint(); } };
      layer.append(back, fwd);
    }
    paint();
  }
}

/* Gemeinsame Fusszeile mit dem Knopf, der zum Wrapped führt */
function finishBar(host, answers, startedAt, pad, onRestart, rerender) {
  const T = t(), n = Object.keys(answers).length;
  const bar = el(`<div style="padding:0 ${pad}px ${pad}px"><button class="finish" ${n ? "" : "disabled"}>${esc(T.finish)} ${SVG.arrow}</button></div>`);
  bar.querySelector("button").onclick = () => {
    if (!n) return;
    startWrapped(host, answers, startedAt, () => {
      Object.keys(answers).forEach(k => delete answers[k]);
      onRestart(); rerender();
    });
  };
  return bar;
}

/* ======================= D · FÜHRUNG ======================= */
/* Konzeptskizze. Keine Ortung: die Position wird abgespielt oder mit dem
   Finger gesetzt. Sie zeigt nur die Idee — das nächste Objekt meldet sich
   von allein, statt dass man es sucht. */
function Fuehrung(root) {
  const SCALE_X = 14, SCALE_Y = 20;   // Meter, die ein Raum in der Skizze misst
  const ARRIVE = 2.6;

  let roomIdx = 0;
  let me = { x: 50, y: 94 }, heading = -90, wp = 0, seg = 0, walking = false;
  let answers = {}, selId = ROUTE_ROOMS[0].spots[0].id, arrived = false;
  let mode = "idle", live = "", sheetId = null, shot = 0, startedAt = Date.now();
  let elMe, elCone, elDist, pinEls = [], inWrapped = false;

  const rec = makeRecorder({
    onInterim: s => { live = s; render(); },
    onFinal: (id, s) => { answers[id] = s; live = ""; render(); },
    onState: s => { mode = s; render(); },
  });

  const room = () => ROUTE_ROOMS[roomIdx];
  const path = () => [{ x: 50, y: 94 }].concat(room().spots.map(s => ({ x: s.x, y: s.y })), [{ x: 50, y: 6 }]);
  const distM = (a, b) => Math.hypot((a.x - b.x) * SCALE_X / 100, (a.y - b.y) * SCALE_Y / 100);

  function nearest() {
    let best = null, bd = Infinity;
    room().spots.forEach(s => { const d = distM(me, s); if (d < bd) { bd = d; best = s; } });
    return { spot: best, d: bd };
  }

  function enterRoom(i, dir) {
    roomIdx = (i + ROUTE_ROOMS.length) % ROUTE_ROOMS.length;
    me = { x: 50, y: dir < 0 ? 6 : 94 };
    wp = 0; seg = 0; heading = dir < 0 ? 90 : -90;
    selId = room().spots[0].id; mode = "idle"; live = ""; sheetId = null;
    render();
  }

  function tick() {
    if (!walking || sheetId || inWrapped) return;
    const P = path();
    if (wp >= P.length - 1) { enterRoom(roomIdx + 1, 1); return; }
    const a = P[wp], b = P[wp + 1];
    const len = Math.hypot(b.x - a.x, b.y - a.y) || 1;
    seg += 1.2 / len;
    if (seg >= 1) { seg = 0; wp++; if (wp >= P.length - 1) { enterRoom(roomIdx + 1, 1); return; } }
    const A = P[wp], B = P[wp + 1] || P[wp];
    me = { x: A.x + (B.x - A.x) * seg, y: A.y + (B.y - A.y) * seg };
    heading = Math.atan2(B.y - A.y, B.x - A.x) * 180 / Math.PI;
    paint();
  }
  setInterval(tick, 80);

  function paint() {
    if (!elMe || !elMe.isConnected) return;
    const T = t();
    elMe.style.left = me.x + "%"; elMe.style.top = me.y + "%";
    elCone.style.left = me.x + "%"; elCone.style.top = me.y + "%";
    elCone.style.transform = `translate(-50%,-50%) rotate(${heading}deg)`;
    const n = nearest(), now = !!(n.spot && n.d < ARRIVE);
    pinEls.forEach(p => p.classList.toggle("near", now && p.dataset.id === n.spot.id));
    elDist.innerHTML = now
      ? `<span class="arrived">${SVG.check} ${esc(T.here)}</span>`
      : `${esc(T.next)} · <b>${Math.max(1, Math.round(n.d))} m</b>`;
    if (now && selId !== n.spot.id) { selId = n.spot.id; arrived = true; mode = "idle"; live = ""; render(); return; }
    arrived = now;
  }

  function render() {
    const T = t(), o = obj(selId), d = loc(o), saved = answers[selId], R = room();
    root.innerHTML = ""; pinEls = [];
    root.append(el(`<div class="topbar">
      <div class="brand"><i>◆</i> SMÄK</div>
      <div class="count"><b>${Object.keys(answers).length}</b> / ${OBJECTS.length} ${esc(T.erzaehlt)}</div></div>`));
    root.append(el(`<div class="hair"></div>`));

    const body = el(`<div class="fuehrung">
      <div class="roomhead"></div><div class="rstage"></div>
      <div class="fbar"></div><div class="detail"></div></div>`);

    const head = body.querySelector(".roomhead");
    const prev = el(`<button class="rnav">${SVG.left}</button>`);
    const next = el(`<button class="rnav">${SVG.right}</button>`);
    prev.onclick = () => enterRoom(roomIdx - 1, -1);
    next.onclick = () => enterRoom(roomIdx + 1, 1);
    head.append(prev, el(`<div class="rn">${esc(R[LANG])}</div>`),
      el(`<div class="rc">${esc(T.room)} ${roomIdx + 1} / ${ROUTE_ROOMS.length}</div>`), next);

    const st = body.querySelector(".rstage");
    st.append(el(`<div class="door top"><span>${esc(ROUTE_ROOMS[(roomIdx + 1) % ROUTE_ROOMS.length][LANG])}</span></div>`));
    st.append(el(`<div class="door bot"><span>${esc(ROUTE_ROOMS[(roomIdx - 1 + ROUTE_ROOMS.length) % ROUTE_ROOMS.length][LANG])}</span></div>`));
    R.spots.forEach(s => {
      const oo = obj(s.id), od = loc(oo), has = !!answers[s.id];
      const p = el(`<button class="rpin ${has ? "has" : ""}" data-id="${s.id}"
        style="left:${s.x}%;top:${s.y}%" aria-label="${esc(od.title)}"><img src="${IMG}${oo.img}" alt="" /></button>`);
      p.onclick = (e) => { e.stopPropagation(); selId = s.id; mode = "idle"; live = ""; render(); };
      st.append(p); pinEls.push(p);
      if (has) st.append(el(`<div class="rtick" style="left:calc(${s.x}% + 24px);top:calc(${s.y}% + 14px)">${SVG.check}</div>`));
      st.append(el(`<div class="rlabel" style="left:${s.x}%;top:calc(${s.y}% + 44px)">${esc(od.epoche)}</div>`));
    });
    elCone = el(`<div class="cone"></div>`); st.append(elCone);
    elMe = el(`<div class="me"></div>`); st.append(elMe);
    st.onclick = (e) => {
      const r = st.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width * 100, ny = (e.clientY - r.top) / r.height * 100;
      heading = Math.atan2(ny - me.y, nx - me.x) * 180 / Math.PI;
      me = { x: nx, y: ny }; walking = false; paint();
    };

    const bar = body.querySelector(".fbar");
    const go = el(`<button class="chip ${walking ? "on" : ""}">${esc(walking ? T.pause : T.walk)}</button>`);
    go.onclick = () => { walking = !walking; render(); };
    elDist = el(`<div class="dist"></div>`);
    bar.append(go, el(`<span class="stub">${esc(T.sketch)}</span>`), elDist);

    const det = body.querySelector(".detail");
    const row = el(`<div class="row"></div>`);
    const tap = el(`<button class="tapphoto">
      <div class="kthumb"><img src="${IMG}${o.img}" alt="" /></div><span class="more">+</span></button>`);
    tap.onclick = () => { sheetId = selId; shot = 0; render(); };
    row.append(tap, el(`<div><div class="eyebrow">${esc(d.room)} · ${esc(d.epoche)}</div>
      <div class="vtitle" style="margin:4px 0 0;font-size:16px">${esc(d.title)}</div></div>`));
    det.append(row);
    det.append(el(saved ? `<div class="saved">${SVG.check}<p>„${esc(saved)}“</p></div>`
                        : `<div class="frage dfrage">${esc(T.einladung)}</div>`));

    if (mode === "nospeech") {
      const ta = el(`<textarea class="typed" rows="2" placeholder="${esc(T.placeholder)}"></textarea>`);
      const ok = el(`<button class="linkish">${esc(T.save)}</button>`);
      ok.onclick = () => { if (ta.value.trim()) answers[selId] = ta.value.trim(); mode = "idle"; render(); };
      det.append(ta, ok); setTimeout(() => ta.focus(), 30);
    } else {
      const mrow = el(`<div style="display:flex;align-items:center;gap:13px"></div>`);
      const mic = el(`<button class="mic ${mode === "rec" ? "rec" : (saved ? "done" : "")}" style="width:56px;height:56px;flex:0 0 auto">${mode === "rec" ? SVG.stop : SVG.mic}</button>`);
      mic.onclick = () => rec.toggle(selId);
      mrow.append(mic, el(`<div style="flex:1;text-align:left">
        <div class="live" style="text-align:left">${mode === "rec" ? esc(live || "…") : ""}</div>
        <div class="hint" style="text-align:left">${esc(mode === "rec" ? T.listening : (arrived ? T.sayHere : T.sayAny))}</div></div>`));
      det.append(mrow);
      if (mode !== "rec") {
        const alt = el(`<button class="linkish" style="align-self:flex-start;padding-left:0">${esc(T.typeInstead)}</button>`);
        alt.onclick = () => { mode = "nospeech"; render(); };
        det.append(alt);
      }
    }
    root.append(body);

    const n = Object.keys(answers).length;
    const fin = el(`<div style="padding:0 16px 16px"><button class="finish" ${n ? "" : "disabled"}>${esc(T.finish)} ${SVG.arrow}</button></div>`);
    fin.querySelector("button").onclick = () => {
      if (!n) return;
      inWrapped = true; walking = false;
      startWrapped(root, answers, startedAt, () => {
        Object.keys(answers).forEach(k => delete answers[k]);
        inWrapped = false; roomIdx = 0; startedAt = Date.now();
        enterRoom(0, 1);
      });
    };
    root.append(fin);
    root.append(objektblatt());
    paint();
  }

  /* Objektblatt: Beschreibung, weitere Aufnahmen, Audioguide (Platzhalter) */
  function objektblatt() {
    const T = t();
    const sheet = el(`<div class="sheet ${sheetId ? "open" : ""}"><div class="sheetbody"><div class="grab"></div></div></div>`);
    sheet.onclick = (e) => { if (e.target === sheet) { sheetId = null; render(); } };
    if (!sheetId) return sheet;

    const o = obj(sheetId), d = loc(o), gal = GALERIE[sheetId] || [];
    const big = gal[shot] || o.img;
    const sb = sheet.querySelector(".sheetbody");

    sb.append(el(`<div class="bigshot"><img src="${IMG}${big}" alt="${esc(d.title)}" /></div>`));
    if (gal.length > 1) {
      const strip = el(`<div class="strip"></div>`);
      gal.forEach((g, i) => {
        const b = el(`<button class="${i === shot ? "on" : ""}"><img src="${IMG}${g}" alt="" /></button>`);
        b.onclick = () => { shot = i; render(); };
        strip.append(b);
      });
      sb.append(strip);
    }
    sb.append(el(`<div>
      <div class="eyebrow">${esc(d.room)} · ${esc(d.epoche)} · ${esc(T.shots(gal.length || 1))}</div>
      <div class="vtitle" style="margin:5px 0 0;font-size:18px">${esc(d.title)}</div></div>`));
    sb.append(el(`<div class="beschreibung">${esc(d.fact)}</div>`));

    const bars = Array.from({ length: 34 }, (_, i) =>
      `<i style="height:${20 + Math.round(70 * Math.abs(Math.sin(i * 1.7)))}%"></i>`).join("");
    sb.append(el(`<div>
      <div class="audio"><div class="play">${SVG.play}</div><div class="wave">${bars}</div><div class="len">2:14</div></div>
      <div class="stub" style="margin-top:7px">${esc(T.audioStub)}</div></div>`));

    const close = el(`<button class="linkish" style="align-self:center">${esc(T.close)}</button>`);
    close.onclick = () => { sheetId = null; render(); };
    sb.append(close);
    return sheet;
  }

  render();
  return { relang: render };
}

/* ======================= Werkbank ======================= */
const SLOTS = [
  { key:"d", make:Fuehrung, name:"nameD", why:"whyD" },
  { key:"a", make:Vitrine,  name:"nameA", why:"whyA" },
  { key:"b", make:Kartei,   name:"nameB", why:"whyB" },
  { key:"c", make:Saal,     name:"nameC", why:"whyC" },
];
let visible = "d";                     // Fokus liegt auf D
const apps = {};

function buildRack() {
  const rack = document.getElementById("rack");
  rack.innerHTML = "";
  SLOTS.forEach(s => {
    rack.append(el(`<figure class="slot" data-slot="${s.key}">
      <figcaption><div class="name"></div><div class="why"></div></figcaption>
      <div class="device"><div class="screen" id="scr-${s.key}"></div></div></figure>`));
    apps[s.key] = s.make(document.getElementById("scr-" + s.key));
  });
  paintChrome();
}

function paintChrome() {
  const T = t();
  document.documentElement.lang = LANG;
  document.getElementById("labTitle").textContent = T.labTitle;
  document.getElementById("labIntro").textContent = T.labIntro;

  const tabs = document.getElementById("tabs");
  tabs.innerHTML = "";
  [{ k:"all", l:T.tabAll }].concat(SLOTS.map(s => ({ k:s.key, l:T["tab" + s.key.toUpperCase()] })))
    .forEach(dd => {
      const b = el(`<button data-slot="${dd.k}" aria-pressed="${visible === dd.k}">${esc(dd.l)}</button>`);
      b.onclick = () => { visible = dd.k; paintChrome(); };
      tabs.append(b);
    });

  SLOTS.forEach(s => {
    const fig = document.querySelector(`.slot[data-slot="${s.key}"]`);
    fig.querySelector(".name").textContent = T[s.name];
    fig.querySelector(".why").textContent = T[s.why];
    fig.classList.toggle("hidden", visible !== "all" && visible !== s.key);
  });
}

document.getElementById("langsw").addEventListener("click", (e) => {
  const b = e.target.closest("button"); if (!b) return;
  LANG = b.dataset.lang;
  document.querySelectorAll("#langsw button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  Object.values(apps).forEach(a => a.relang());   // Zustand bleibt, nur die Sprache wechselt
  paintChrome();
});

buildRack();
</script>
